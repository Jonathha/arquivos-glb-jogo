<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa + Personagem</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#87a9c9;font-family:system-ui,sans-serif}
  canvas{display:block}
  #info{position:fixed;left:12px;top:12px;color:#fff;background:#0008;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.5;pointer-events:none}
  #load{position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#111;font-size:18px}
</style>
</head>
<body>
<div id="load">Carregando mapa...</div>
<div id="info">WASD: andar · Shift: correr · Espaço: pular<br>Arrastar mouse: girar câmera · Scroll: zoom<br>
<span style="opacity:.7">Mapa: 3D KING FF · Personagem: FFCN (CC-BY-4.0, Sketchfab)</span></div>
<script type="importmap">
{"imports":{"three":"./lib/three/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/three/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a9c9);
const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
scene.add(new THREE.HemisphereLight(0xffffff,0x667766,1.1));
const sun = new THREE.DirectionalLight(0xffffff,1.2); sun.position.set(30,60,20); scene.add(sun);

const loader = new GLTFLoader();
const load = u => new Promise((res,rej)=>loader.load(u,res,undefined,rej));
const [mapGltf, charGltf] = await Promise.all([
  load('./free_fire_old_training_ground_3d_model/free_fire_old_training_ground_3d_model.gltf'),
  load('./personagem/bunny.glb')
]);

const map = mapGltf.scene;
scene.add(map);
map.updateMatrixWorld(true);
const mapBox = new THREE.Box3().setFromObject(map);

const char = new THREE.Group();
const model = charGltf.scene;
scene.add(char); char.add(model);
model.updateMatrixWorld(true);
const cb = new THREE.Box3().setFromObject(model);
const cs = cb.getSize(new THREE.Vector3());
const CHAR_H = 1.8;                       // altura do personagem no mapa
const k = CHAR_H / cs.y;
model.scale.setScalar(k);
model.position.set(-(cb.min.x+cb.max.x)/2*k, -cb.min.y*k, -(cb.min.z+cb.max.z)/2*k);

// chão: raycast pra baixo no mapa
const ray = new THREE.Raycaster(); const DOWN = new THREE.Vector3(0,-1,0);
const meshes = []; map.traverse(o=>{ if(o.isMesh) meshes.push(o); });
function groundY(x,z,fromY){
  ray.set(new THREE.Vector3(x,fromY,z),DOWN); ray.far = 200;
  const h = ray.intersectObjects(meshes,false);
  return h.length ? h[0].point.y : null;
}
const center = mapBox.getCenter(new THREE.Vector3());
let startY = groundY(center.x,center.z,mapBox.max.y+5);
if(startY===null){ // procura um ponto com chão perto do centro
  outer: for(let r=2;r<40;r+=2) for(let a=0;a<12;a++){
    const x=center.x+Math.cos(a)*r, z=center.z+Math.sin(a)*r;
    const y=groundY(x,z,mapBox.max.y+5); if(y!==null){ center.set(x,0,z); startY=y; break outer; }
  }
}
char.position.set(center.x,(startY??mapBox.min.y)+0.05,center.z);

window.__info = {mapBox:[...mapBox.min.toArray(),...mapBox.max.toArray()], charSize:cs.toArray(), start:char.position.toArray(), meshes:meshes.length};
document.getElementById('load').remove();

// controles
const keys = {};
addEventListener('keydown',e=>{keys[e.code]=true; if(e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>keys[e.code]=false);
let yaw=0, pitch=0.35, dist=7, drag=false;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointerup',()=>drag=false);
renderer.domElement.addEventListener('pointermove',e=>{ if(!drag)return;
  yaw -= e.movementX*0.005; pitch = Math.min(1.3,Math.max(-0.2,pitch+e.movementY*0.005)); });
addEventListener('wheel',e=>{dist=Math.min(40,Math.max(2,dist+e.deltaY*0.01));},{passive:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

let vy=0, onGround=true;
const clock = new THREE.Clock();
const fwd=new THREE.Vector3(), right=new THREE.Vector3(), mv=new THREE.Vector3();
function tick(){
  const dt=Math.min(clock.getDelta(),0.05);
  fwd.set(-Math.sin(yaw),0,-Math.cos(yaw)); right.set(-fwd.z,0,fwd.x).multiplyScalar(-1);
  mv.set(0,0,0);
  if(keys.KeyW)mv.add(fwd); if(keys.KeyS)mv.sub(fwd);
  if(keys.KeyD)mv.add(right); if(keys.KeyA)mv.sub(right);
  if(mv.lengthSq()>0){
    mv.normalize().multiplyScalar((keys.ShiftLeft||keys.ShiftRight?9:4.5)*dt);
    char.position.x+=mv.x; char.position.z+=mv.z;
    char.rotation.y = Math.atan2(mv.x,mv.z);
  }
  if(keys.Space&&onGround){vy=6;onGround=false;}
  vy-=18*dt; char.position.y+=vy*dt;
  const gy = groundY(char.position.x,char.position.z,char.position.y+1.2);
  const floor = gy ?? mapBox.min.y;
  if(char.position.y<=floor){char.position.y=floor;vy=0;onGround=true;} else if(char.position.y>floor+0.05) onGround=false;
  if(char.position.y<mapBox.min.y-30){char.position.set(center.x,(startY??0)+0.5,center.z);vy=0;}

  const t=char.position;
  camera.position.set(t.x+Math.sin(yaw)*Math.cos(pitch)*dist, t.y+1.2+Math.sin(pitch)*dist, t.z+Math.cos(yaw)*Math.cos(pitch)*dist);
  camera.lookAt(t.x,t.y+1.0,t.z);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
