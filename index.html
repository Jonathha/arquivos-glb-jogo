<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa + Personagem</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#87a9c9;font-family:system-ui,sans-serif}
  canvas{display:block}
  #info{position:fixed;left:12px;top:12px;color:#fff;background:#0008;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.5;pointer-events:none}
  #load{position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#111;font-size:18px}
</style>
</head>
<body>
<div id="load">Carregando mapa...</div>
<div id="info">WASD: andar · Shift: correr · Espaço: pular<br>Segurar clique: atirar (UMP) · Arrastar mouse: girar câmera · Scroll: zoom<br>- / = : tamanho (<span id="sz"></span>) · Q: câmera livre · P: teleportar<br>
<span style="opacity:.7">Mapa: 3D KING FF · Personagem: Soldier (Mixamo) · UMP: Quaternius (CC0)</span></div>
<script type="importmap">
{"imports":{"three":"./lib/three/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/three/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a9c9);
const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.05,1000);
scene.add(new THREE.HemisphereLight(0xffffff,0x667766,1.1));
const sun = new THREE.DirectionalLight(0xffffff,1.2); sun.position.set(30,60,20); scene.add(sun);

const loader = new GLTFLoader();
const load = u => new Promise((res,rej)=>loader.load(u,res,undefined,rej));
const [mapGltf, charGltf, umpGltf] = await Promise.all([
  load('./free_fire_old_training_ground_3d_model/free_fire_old_training_ground_3d_model.gltf'),
  load('./personagem/soldier.glb'),
  load('./armas/ump.glb')                       // UMP (SubmachineGun 2, Quaternius/Poly Pizza, CC0)
]);

const map = mapGltf.scene;
scene.add(map);
map.updateMatrixWorld(true);
const mapBox = new THREE.Box3().setFromObject(map);

const char = new THREE.Group();            // posição física + direção
const vis = new THREE.Group();             // animação procedural (inclinação, squash)
const model = charGltf.scene;
model.rotation.y = Math.PI;               // o Mixamo sai com frente em -Z; o jogo assume frente +Z
scene.add(char); char.add(vis); vis.add(model);
model.updateMatrixWorld(true);
const cb = new THREE.Box3().setFromObject(model);
const cs = cb.getSize(new THREE.Vector3());
let charH = 0.4;                           // altura do personagem no mapa (teclas - e = ajustam)
let modelScale = 1;                        // escala do modelo esquelético (para sincronia de passos)
let gunLoaded = false;                     // arma (UMP) presa ao esqueleto e pronta
function applyScale(){
  const k = charH / cs.y;
  modelScale = k;
  model.scale.setScalar(k);
  model.position.set(-(cb.min.x+cb.max.x)/2*k, -cb.min.y*k, -(cb.min.z+cb.max.z)/2*k);
  gunFit();                                     // arma acompanha a altura do personagem
  const el = document.getElementById('sz'); if(el) el.textContent = charH.toFixed(2);
}
applyScale();

// ---------- animações esqueléticas (Soldier: Idle/Run/Walk) ----------
const mixer = new THREE.AnimationMixer(model);
const clips = {};
for(const c of charGltf.animations) clips[c.name] = mixer.clipAction(c);
let curA=null, curName='';
function fadeClip(next,name,t=0.22){
  const prev = curA; curA = next; curName = name;
  next.reset(); next.setEffectiveWeight(1);
  if(prev) next.crossFadeFrom(prev,t,false);
  next.play();
}
if(clips.Idle) fadeClip(clips.Idle,'Idle');

// ---------- identidade visual do personagem anterior (traje escuro + orelhas) ----------
model.traverse(o=>{
  if(o.isMesh) [].concat(o.material).forEach(m=>{
    m.color.setHex(0x151b26);                 // traje escuro do personagem original
    if(m.emissive) m.emissive.setHex(0x050b18);
    m.roughness = Math.min(m.roughness ?? 1, 0.55);
  });
});
{
  const head = model.getObjectByName('mixamorig:Head') || model.getObjectByName('mixamorigHead');
  if(head){
    const earMat = new THREE.MeshStandardMaterial({color:0x151b26, roughness:0.5, emissive:0x0a1e4d, emissiveIntensity:0.6});
    const earGeo = new THREE.CylinderGeometry(3.2,4.6,34,10);   // frame local do osso em cm
    for(const s of [-1,1]){
      const ear = new THREE.Mesh(earGeo, earMat);
      ear.position.set(7.5*s, 15, 1);
      ear.rotation.z = -0.16*s; ear.rotation.x = -0.1;
      head.add(ear);                            // acompanha o esqueleto (articulado)
    }
  }
}

// ---------- UMP: presa ao osso da mão direita (mesmo padrão das orelhas) ----------
const ump = umpGltf.scene;
const gunBox = new THREE.Box3().setFromObject(ump);
const gunHand = model.getObjectByName('mixamorig:RightHand') || model.getObjectByName('mixamorigRightHand');
const gunRoot = new THREE.Group();              // grupo de montagem na mão
const gunMuzzle = new THREE.Object3D();         // ponta do cano (+X = mira)
gunMuzzle.position.set(gunBox.max.x+0.03, (gunBox.min.y+gunBox.max.y)/2, (gunBox.min.z+gunBox.max.z)/2);
ump.add(gunMuzzle);
// rotação: cano (+X da arma) -> dedos (+Y do osso); "para cima" da arma -> Z do osso
ump.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(
  new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1), new THREE.Vector3(1,0,0)));
const gunGrip = new THREE.Object3D();           // zona da empunhadura (no espaço local da UMP)
gunGrip.position.set(0.55,-0.5,0);
ump.add(gunGrip);
gunRoot.add(ump);
const gunLight = new THREE.PointLight(0xffd9a0,0,1); gunRoot.add(gunLight);
const _bw = new THREE.Box3(), _gs = new THREE.Vector3(), _gw = new THREE.Vector3(), _hi = new THREE.Matrix4();
function gunFit(){                              // escala/ancoragem numéricas (independente do frame do osso)
  if(!gunLoaded) return;
  gunRoot.position.set(0,0,0); gunRoot.scale.setScalar(1);
  vis.updateMatrixWorld(true);                  // pose real do esqueleto
  _bw.setFromObject(gunRoot); _bw.getSize(_gs);
  gunRoot.scale.setScalar(0.55*charH/_gs.x);    // comprimento no mundo = 0,55*charH
  vis.updateMatrixWorld(true);
  gunGrip.getWorldPosition(_gw);                // leva o grip até a origem do osso da mão
  _hi.copy(gunHand.matrixWorld).invert();
  gunRoot.position.copy(_gw).applyMatrix4(_hi).negate();
}
if(gunHand){ gunHand.add(gunRoot); gunLoaded = true; gunFit(); }

// ---------- efeitos de tiro (sem transparência: flash/tracers/faíscas em mescla aditiva opaca, escala de anima) ----------
const fxFlash = new THREE.Mesh(new THREE.OctahedronGeometry(1),new THREE.MeshBasicMaterial({color:0xffd070,blending:THREE.AdditiveBlending,depthWrite:false}));
fxFlash.visible=false; scene.add(fxFlash);
const fxSparks = [];                                            // faíscas do impacto
for(let i=0;i<16;i++){
  const s = new THREE.Mesh(new THREE.TetrahedronGeometry(1),new THREE.MeshBasicMaterial({color:0xffa030,blending:THREE.AdditiveBlending,depthWrite:false}));
  s.visible=false; s.userData={v:new THREE.Vector3(),o:0}; scene.add(s); fxSparks.push(s);
}
let fxFlashT = 0;
const _m = new THREE.Vector3(), _h = new THREE.Vector3(), _dv = new THREE.Vector3(), _upV = new THREE.Vector3(0,1,0);
const tracerGeo = new THREE.CylinderGeometry(1,1,1,5,1,true); tracerGeo.translate(0,0.5,0);   // base em Y=0, sobe +Y
const tracers = [];                                             // tracers como "tubo" fino
for(let i=0;i<20;i++){
  const t = new THREE.Mesh(tracerGeo,new THREE.MeshBasicMaterial({color:0xffd9a0,blending:THREE.AdditiveBlending,depthWrite:false}));
  t.visible=false; t.frustumCulled=false; t.userData={o:0,len:1}; scene.add(t); tracers.push(t);
}
function fxTracer(a,b){ const l = tracers.find(x=>x.userData.o<=0) || tracers[0];
  _dv.subVectors(b,a); const len=_dv.length();
  l.userData.len = len>1e-4?len:1e-4;
  l.quaternion.setFromUnitVectors(_upV, _dv.normalize());
  l.position.copy(a);
  l.scale.set(0.04*charH, l.userData.len, 0.04*charH);
  l.userData.o=1; l.visible=true;
}
function fxImpact(p){ for(let i=0;i<4;i++){ const s = fxSparks.find(x=>x.userData.o<=0); if(!s) return;
  s.position.copy(p); s.userData.v.set(Math.random()-0.5,Math.random()*0.8,Math.random()-0.5).multiplyScalar(2.2*charH);
  s.userData.o=1; s.visible=true; } }

// ---------- colisão ----------
const ray = new THREE.Raycaster();
const DOWN = new THREE.Vector3(0,-1,0);
const UP = new THREE.Vector3(0,1,0);
const meshes = []; map.traverse(o=>{ if(o.isMesh) meshes.push(o); });
const _o = new THREE.Vector3(), _n = new THREE.Vector3(), _nm = new THREE.Matrix3();
function groundY(x,z,fromY){
  ray.set(_o.set(x,fromY,z),DOWN); ray.far = 300;
  const h = ray.intersectObjects(meshes,false)[0];
  return h ? h.point.y : null;
}
function wallHit(px,py,pz,dir,dist,H){
  let best = null;
  for(const f of [0.4,0.65,0.9]){
    ray.set(_o.set(px,py+f*H,pz),dir); ray.far = dist;
    const h = ray.intersectObjects(meshes,false)[0];
    if(!h || !h.face) continue;
    _n.copy(h.face.normal).applyMatrix3(_nm.getNormalMatrix(h.object.matrixWorld)).normalize();
    if(_n.dot(dir) > 0) _n.negate();
    if(Math.abs(_n.y) > 0.7) continue;      // chão ou rampa suave, não é parede
    if(!best || h.distance < best.d) best = {nx:_n.x, nz:_n.z, d:h.distance};
  }
  return best;
}

// ---------- spawn: na fonte ----------
const fountain = map.getObjectByName('M_AlphaIsland_Fountain_247');
const spawn = new THREE.Vector3();
{
  const fb = fountain ? new THREE.Box3().setFromObject(fountain) : mapBox;
  const fc = fb.getCenter(new THREE.Vector3()), fs = fb.getSize(new THREE.Vector3());
  spawn.set(fc.x, 0, fc.z + (fountain ? fs.z/2 + 1.0 : 0));
  const y = groundY(spawn.x,spawn.z,fb.max.y+3);
  spawn.y = (y ?? fb.min.y) + 0.02;
}

// ---------- estado ----------
const pos = spawn.clone(), vel = new THREE.Vector3();
let vy = 0, grounded = true, coyote = 0, jumpBuf = 0, facing = 0, yawRate = 0;
let phase = 0, lean = 0, roll = 0, sq = 0, sqV = 0, stepOff = 0, ampBob = 0, tAnim = 0;
char.position.copy(pos);
const camT = pos.clone();

window.__info = {mapBox:[...mapBox.min.toArray(),...mapBox.max.toArray()], charSize:cs.toArray(), spawn:spawn.toArray(), fountain:!!fountain, meshes:meshes.length};
document.getElementById('load').remove();

// ---------- controles ----------
const keys = {};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'){ e.preventDefault(); if(!fly) jumpBuf=0.12; }
  if(e.code==='KeyQ' && !e.repeat && !/^(INPUT|TEXTAREA)$/.test(e.target?.tagName||'')){
    fly=!fly; if(fly) flyPos.copy(camera.position);      // sai do ponto atual da câmera
  }
  if(e.code==='Minus'||e.code==='NumpadSubtract'){ charH=Math.max(0.3,charH/1.1); applyScale(); }
  if(e.code==='Equal'||e.code==='NumpadAdd'){ charH=Math.min(3,charH*1.1); applyScale(); }
  if(e.code==='KeyP' && !e.repeat && !/^(INPUT|TEXTAREA)$/.test(e.target?.tagName||'')){
    if(fly){
      const px=flyPos.x+fF.x*1.2, pz=flyPos.z+fF.z*1.2;
      const gy=groundY(px,pz,flyPos.y+2);
      pos.set(px,(gy!==null?gy:flyPos.y-2)+0.02,pz);        // teleporta o personagem pra area que a camera livre esta vendo
    } else {
      pos.copy(spawn);                                     // fora do modo livre: respawn no spawn
    }
    vel.set(0,0,0); vy=0; grounded=true; stepOff=0; sq=0; camT.copy(pos);
  }
});
addEventListener('keyup',e=>keys[e.code]=false);
let yaw=0, pitch=0.35, dist=4.5, drag=false;
let fly=false;                                    // modo Fly Camera (tecla Q alterna)
const flyPos=new THREE.Vector3();                 // posição da câmera no modo livre
const fF=new THREE.Vector3(), rF=new THREE.Vector3(); // frente/direita da câmera livre
renderer.domElement.addEventListener('pointerdown',e=>{drag=true; if(e.button===0) firing=true; renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointerup',()=>{drag=false; firing=false;});
addEventListener('blur',()=>{drag=false; firing=false;});
renderer.domElement.addEventListener('pointermove',e=>{ if(!drag)return;
  yaw -= e.movementX*0.005;
  const lim = fly ? 1.55 : 1.3, lo = fly ? -1.55 : -0.2;
  pitch = Math.min(lim,Math.max(lo,pitch+e.movementY*0.005)); });
addEventListener('wheel',e=>{dist=Math.min(30,Math.max(1.5,dist+e.deltaY*0.005));},{passive:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

const damp = (a,b,l,dt)=>a+(b-a)*(1-Math.exp(-l*dt));
const fwd=new THREE.Vector3(), right=new THREE.Vector3(), want=new THREE.Vector3(), dir=new THREE.Vector3();
let firing=false, fireCd=0, shots=0;                     // tiro da UMP (segurar botão esquerdo)
const _mq=new THREE.Quaternion(), _ho=new THREE.Quaternion(), _Hq=new THREE.Quaternion(), _tg=new THREE.Quaternion();
const _ms=new THREE.Vector3(), _av=new THREE.Vector3();
const IDQ = new THREE.Quaternion();
let aimAmt = 0;                                          // mistura da pose de mira (0=repouso,1=mira)

function gunAim(aim,dt){                                 // pose de mira: cano -> direção da câmera
  if(!gunLoaded) return;
  vis.updateMatrixWorld(true);
  if(aim){
    aimAmt = damp(aimAmt,1,14,dt);
    gunMuzzle.getWorldQuaternion(_mq);                   // onde o cano aponta no mundo agora
    _ms.set(1,0,0).applyQuaternion(_mq).normalize();
    _mq.setFromUnitVectors(_ms, aim);                    // desvio mundo: cano -> mira
    gunHand.getWorldQuaternion(_ho);                     // converte p/ espaço do osso: H^-1 * Q * H
    _Hq.copy(_ho).invert();
    _tg.copy(gunRoot.quaternion);                        // L
    _tg.premultiply(_ho);                                // H * L
    _tg.premultiply(_mq);                                // Q * H * L
    _tg.premultiply(_Hq);                                // H^-1 * Q * H * L
    gunRoot.quaternion.slerp(_tg, 1-Math.exp(-18*dt));
  } else {
    aimAmt = damp(aimAmt,0,9,dt);
    gunRoot.quaternion.slerp(IDQ, 1-Math.exp(-10*dt));
  }
}

function shoot(){
  fireCd = 0.1;                                     // cadência de UMP: ~600 rpm
  shots++;
  vis.updateMatrixWorld(true);                      // garante frame do esqueleto/arma p/ muzzle
  const cP=Math.cos(pitch), sP=Math.sin(pitch), sY=Math.sin(yaw), cY=Math.cos(yaw);
  _h.set(-sY*cP,-sP,-cY*cP).normalize();            // direção da mira (mesma da câmera)
  _h.x += (Math.random()-0.5)*0.012; _h.y += (Math.random()-0.5)*0.012; _h.z += (Math.random()-0.5)*0.012;
  _h.normalize();
  gunMuzzle.getWorldPosition(_m);                   // saída visual do projétil: ponta do cano
  ray.set(camera.position,_h); ray.far=300; ray.near=0;
  const hit = ray.intersectObjects(meshes,false)[0];
  const hp = hit ? hit.point : _o.copy(camera.position).addScaledVector(_h,200);
  fxTracer(_m,hp);
  if(hit){
    _n.copy(hit.face.normal).applyMatrix3(_nm.getNormalMatrix(hit.object.matrixWorld)).normalize();
    fxImpact(hit.point);                            // faíscas no impacto
  }
  // flash do disparo + luz rápida na ponta do cano
  fxFlash.position.copy(_m); fxFlash.visible=true; fxFlash.scale.setScalar(0.32*charH);
  fxFlash.rotation.x = Math.random()*3; fxFlash.rotation.z = Math.random()*3; fxFlashT = 0.07;
  const gl = gunRoot.children.find(c=>c.isPointLight);
  if(gl){ gl.position.set(0,0,0); gl.intensity = 6; gl.distance = 4*charH; }
  pitch = Math.min(1.55, pitch + 0.004 + (Math.random()-0.5)*0.002);   // recuo leve
}

function moveHoriz(dx,dz,H){
  const R = 0.16*H;
  const len = Math.hypot(dx,dz); if(len<1e-6) return;
  dir.set(dx/len,0,dz/len);
  const hit = wallHit(pos.x,pos.y,pos.z,dir,len+R,H);
  if(!hit){ pos.x+=dx; pos.z+=dz; return; }
  const ok = Math.max(0,hit.d-R); pos.x+=dir.x*ok; pos.z+=dir.z*ok;
  // bloqueia na direcao pedida: sem deslize lateral, sem girar de lado
}
const _dir8 = new THREE.Vector3();
function unstick(H){                                      // nao deixa o deslize em torno de cantos chegar dentro do volume
  const R = 0.16*H;
  for(let it=0; it<2; it++){
    let best = null;
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4;
      _dir8.set(Math.cos(a),0,Math.sin(a));
      ray.set(_o.set(pos.x,pos.y+0.62*H,pos.z),_dir8); ray.far = R+0.03;
      const h = ray.intersectObjects(meshes,false)[0];
      if(!h || !h.face) continue;
      _n.copy(h.face.normal).applyMatrix3(_nm.getNormalMatrix(h.object.matrixWorld)).normalize();
      if(_n.dot(_dir8) > 0) _n.negate();
      if(Math.abs(_n.y) > 0.7) continue;
      if(!best || h.distance < best.d) best = {nx:_n.x, nz:_n.z, d:h.distance};
    }
    if(!best || best.d >= R*0.95) break;
    const L = Math.hypot(best.nx,best.nz)||1, push = R-best.d+0.004;
    pos.x += best.nx/L*push; pos.z += best.nz/L*push;
  }
}

const clock = new THREE.Clock();
function tick(){
  const dt = Math.min(clock.getDelta(),0.05); tAnim += dt;
  const H = charH, stepUp = 0.3*H, stepDown = 0.35*H;
  const G = 26*H, JUMP = 7*H;
  const run = keys.ShiftLeft||keys.ShiftRight;

  // direção desejada relativa à câmera
  fwd.set(-Math.sin(yaw),0,-Math.cos(yaw)); right.set(-fwd.z,0,fwd.x);
  want.set(0,0,0);
  if(keys.KeyW)want.add(fwd); if(keys.KeyS)want.sub(fwd);
  if(keys.KeyD)want.add(right); if(keys.KeyA)want.sub(right);
  if(fly) want.set(0,0,0);                             // Fly Camera: personagem parado
  const hasIn = want.lengthSq()>0;
  if(hasIn) want.normalize().multiplyScalar((run?5:2.4)*H);
  const k = grounded ? (hasIn?13:11) : (hasIn?4:0.8);
  vel.x = damp(vel.x,want.x,k,dt); vel.z = damp(vel.z,want.z,k,dt);

  moveHoriz(vel.x*dt, vel.z*dt, H);
  unstick(H);

  // vertical
  jumpBuf = Math.max(0,jumpBuf-dt); coyote = Math.max(0,coyote-dt);
  const gy = grounded ? groundY(pos.x,pos.z,pos.y+2*stepUp) : groundY(pos.x,pos.z,pos.y+stepUp);
  if(grounded){
    vy = 0;
    if(gy!==null && pos.y-gy<=stepDown){
      stepOff += pos.y-gy;                               // offset p/ bob visual (mesma semantica de antes)
      const rise = gy - pos.y;                           // +: degrau acima, -: abaixo
      if(rise > 0.001) pos.y = Math.min(gy, pos.y + 0.5*stepUp);  // sobe degrau em ~2 quadros (antes: teleporte 1 quadro)
      else pos.y = damp(pos.y, gy, 18, dt);              // desce degrau/rampa com follow suave (antes: fica no ar e cai)
    } else { grounded=false; coyote=0.1; }
  }
  if(jumpBuf>0 && (grounded||coyote>0)){
    vy = JUMP; grounded=false; coyote=0; jumpBuf=0; sq=0.22; sqV=0;
  }
  if(!grounded){
    if(vy>0){                                             // teto/proa baixa: cabeça não atravessa
      ray.set(_o.set(pos.x,pos.y,pos.z),UP);
      ray.far = 1.85*H; ray.near = 0.1*H;                 // near descarta o piso em distancia~0
      if(ray.intersectObjects(meshes,false)[0]) vy = 0;
      ray.near = 0;
    }
    vy -= G*dt; pos.y += vy*dt;
    if(gy!==null && pos.y<=gy && vy<=0){
      const impact = -vy; pos.y=gy; vy=0; grounded=true;
      sq = -0.32*Math.min(impact/(9*H),1); sqV=0;         // amassa ao pousar
    }
  }
  if(pos.y < mapBox.min.y-30){ pos.copy(spawn); vel.set(0,0,0); vy=0; }

  // ---------- animação ----------
  const sp = Math.hypot(vel.x,vel.z), spF = Math.min(sp/(5*H),1);
  const aiming = firing && !fly;
  if(aiming){                                       // ao atirar, o corpo mira a câmera
    const cP=Math.cos(pitch), sY=Math.sin(yaw), cY=Math.cos(yaw);
    var aimTarget = Math.atan2(-sY*cP, -cY*cP);
  }
  if(aiming || sp>0.25*H){
    const target= aiming ? aimTarget : Math.atan2(vel.x,vel.z);
    const d=((target-facing+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
    facing += d*(1-Math.exp(-14*dt)); yawRate = damp(yawRate,d*14,10,dt);
  } else yawRate = damp(yawRate,0,10,dt);
  lean = damp(lean, grounded ? spF*0.24 : Math.max(-0.25,Math.min(0.25,-vy/(14*H)))*0.8 + spF*0.12, 9, dt);
  roll = damp(roll, -Math.max(-1,Math.min(1,yawRate*0.12))*0.3*spF, 9, dt);
  sqV += (-220*sq - 17*sqV)*dt; sq += sqV*dt;
  stepOff = damp(stepOff,0,16,dt);
  const breathe = Math.sin(tAnim*2.2)*0.012;
  // esqueleto: Idle/Walk/Run com crossfade congelado durante o ar
  if(curA){
    mixer.timeScale = grounded?1:0;
    if(grounded){
      const stride = curName==='Walk'?1.6 : curName==='Run'?5.0 : 0;  // velocidade nativa dos clips (m/s)
      if(stride) curA.timeScale = (sp/modelScale)/stride;
      const walkMin = curName==='Idle' ? 0.35*H : 0.18*H;            // histerese
      const target = sp>walkMin ? (run?'Run':'Walk') : 'Idle';
      if(clips[target] && target!==curName) fadeClip(clips[target],target);
    }
    mixer.update(dt);
  }
  char.position.copy(pos); char.rotation.y = facing;
  vis.position.y = -stepOff;
  vis.rotation.x = lean;
  vis.rotation.z = roll;
  vis.scale.set(1-sq*0.5-breathe*0.5, 1+sq-breathe, 1-sq*0.5-breathe*0.5);

  // câmera suave
  camT.x=damp(camT.x,pos.x,16,dt); camT.z=damp(camT.z,pos.z,16,dt); camT.y=damp(camT.y,pos.y,9,dt);
  const D = dist*H;
  if(fly){
    const cP=Math.cos(pitch), sP=Math.sin(pitch), sY=Math.sin(yaw), cY=Math.cos(yaw);
    fF.set(-sY*cP,-sP,-cY*cP); rF.set(cY,0,-sY);
    const msp=(run?24:8)*dt;
    if(keys.KeyW)flyPos.addScaledVector(fF,msp);
    if(keys.KeyS)flyPos.addScaledVector(fF,-msp);
    if(keys.KeyD)flyPos.addScaledVector(rF,msp);
    if(keys.KeyA)flyPos.addScaledVector(rF,-msp);
    if(keys.Space)flyPos.y+=msp;                      // subir
    if(keys.KeyC)flyPos.y-=msp;                       // descer
    camera.position.copy(flyPos);
    camera.lookAt(flyPos.x+fF.x, flyPos.y+fF.y, flyPos.z+fF.z);
  } else {
    camera.position.set(camT.x+Math.sin(yaw)*Math.cos(pitch)*D, camT.y+0.6*H+Math.sin(pitch)*D, camT.z+Math.cos(yaw)*Math.cos(pitch)*D);
    camera.lookAt(camT.x,camT.y+0.55*H,camT.z);
  }

  // ---------- tiro da UMP ----------
  fireCd -= dt;
  if(firing && !fly && fireCd<=0) shoot();
  { const cP=Math.cos(pitch), sP=Math.sin(pitch), sY=Math.sin(yaw), cY=Math.cos(yaw);
    _av.set(-sY*cP,-sP,-cY*cP).normalize();
    gunAim((firing||aimAmt>0.02) && !fly ? _av : null, dt); }
  // decaimento dos efeitos
  if(fxFlashT>0){ fxFlashT-=dt; const o=Math.max(fxFlashT/0.07,0.001); fxFlash.scale.setScalar(0.32*charH*o); if(fxFlashT<=0) fxFlash.visible=false; }
  const gl = gunRoot.children.find(c=>c.isPointLight);
  if(gl && gl.intensity>0){ gl.intensity = Math.max(0, gl.intensity - 80*dt); }
  for(const l of tracers){ if(l.userData.o>0){ l.userData.o-=dt*12; const o=Math.max(0,l.userData.o); l.scale.set(0.022*charH*o, l.userData.len, 0.022*charH*o); if(l.userData.o<=0) l.visible=false; } }
  for(const s of fxSparks){ if(s.userData.o>0){ s.userData.o-=dt*2.6; s.userData.v.y-=22*charH*dt; s.position.addScaledVector(s.userData.v,dt); s.scale.setScalar(Math.max(0.045*charH*s.userData.o,1e-4)); if(s.userData.o<=0) s.visible=false; } }

  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
window.__t = {v:4, get pos(){return pos.toArray();},get vy(){return vy;},get grounded(){return grounded;},get facing(){return facing;},get yaw(){return yaw;},get shots(){return shots;},
  get gun(){return {hand:!!gunHand, loaded:gunLoaded, s:gunLoaded?gunRoot.scale.x:0, p:gunLoaded?gunRoot.position.toArray():null};},
  get fx(){ return [typeof fxFlash, typeof tracers, tracers?tracers.length:'-', typeof (tracers&&tracers[0])]; },
  get aimErr(){ if(!gunLoaded) return null;
    vis.updateMatrixWorld(true);
    gunMuzzle.getWorldQuaternion(_mq); _ms.set(1,0,0).applyQuaternion(_mq).normalize();
    const cP=Math.cos(pitch), sP=Math.sin(pitch), sY=Math.sin(yaw), cY=Math.cos(yaw);
    _av.set(-sY*cP,-sP,-cY*cP).normalize();
    return +(_ms.dot(_av)).toFixed(3); }};
tick();
